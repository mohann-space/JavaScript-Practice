<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0%;
        }
        nav{
            /* border: 1px solid; */
            height: 60px;
            background-color: black;
            color: white;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            ol{
                display: flex;
                align-items: center;
                justify-content: space-around;
                height: 50px;
                list-style: none;
            }
        }
        form{
            height: 500px;
            width: 100%;
            margin: auto;
            border: 1px solid;
            display: none;
        }
        section{
            display: grid;
            grid-template-columns: repeat(3,300px);
            grid-template-rows: repeat(3,300px);
            gap: 30px;
            div{
                border: 1px solid lightgray;
                height: 200px;
                width: 200px;
            }
        }
        aside{
            border: 1px solid lightgray;
            width: 300px;
            height: 800px;
            position: absolute;
            top: 0%;
            right: 0%;
            background-color: darkgray;
            transform: translateY(-1000px);
        }
        #cartItems>div{
            border: 1px solid;
            width: 100px;
            height: 100px;
        }
    </style>
</head>
<body>
    <nav>
        <ol>
            <li>home</li>
            <li>login</li>
            <li id="reg">register</li>
            <li id="cart">cart</li>
        </ol>
    </nav>
    <form action="">
        <h1>Register</h1>
    </form>
    <section>
        <div>
            <span>1</span>
            <button id="b1">Add to cart</button>
        </div>
        <div>
            <span>2</span>
            <button id="b2">Add to cart</button>
        </div>
        <div>
            <span>3</span>
            <button id="b3">Add to cart</button>
        </div>
        <div>
            <span>4</span>
            <button id="b4">Add to cart</button>
        </div>
        <div>
            <span>5</span>
            <button id="b5">Add to cart</button>
        </div>
        <div>
            <span>6</span>
            <button id="b6">Add to cart</button>
        </div>
    </section>
    <aside>
        <button id="close">X</button>
        <div id="cartItems"></div>
    </aside>
    <script src="./toggle.js"></script>
</body>
</html>
